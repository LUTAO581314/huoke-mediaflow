name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 安装测试依赖
        run: pip install -q pytest
      - name: CLI 能起来
        run: python mf.py -h
      - name: 单元测试
        run: python -m pytest -q
      - name: 语法检查
        run: python -m compileall -q mf.py
