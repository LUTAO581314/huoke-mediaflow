name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unit:
    name: 单元测试 + 音频端到端（规则/CLI/合规拦截/模板/响度）
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 确认 ffmpeg（runner 自带，缺了才装）
        run: command -v ffmpeg && ffmpeg -version | head -1 || sudo apt-get install -y ffmpeg
      - name: 安装测试依赖
        run: pip install -q pytest
      - name: CLI 能起来
        run: python mf.py -h
      - name: 单元测试
        env:
          MF_RULES: ${{ github.workspace }}/docs/剪辑规范.md
        run: python -m pytest -q --ignore=tests/engine
      - name: 语法检查
        run: python -m compileall -q mf.py huoke_lint.py

  engine:
    name: 引擎补丁集成测试（对上游真代码）
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      UPSTREAM: https://github.com/Loliyer520/DSHL-DeepPack-Jian.git
      ENGINE_REF: e1b6130   # 本机实际在跑的版本（2.1.3）；升级时改这里
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: 拉上游 D剪（钉在 ENGINE_REF）
        run: |
          git clone "$UPSTREAM" /tmp/djian
          git -C /tmp/djian checkout -q "$ENGINE_REF"
      - name: 打上两个补丁（会话绑定 + 桌面壳适配）
        run: |
          set -x
          git -C /tmp/djian apply --verbose "${GITHUB_WORKSPACE}/engine/patches/djian-session-binding.patch"
          git -C /tmp/djian apply --verbose "${GITHUB_WORKSPACE}/engine/patches/djian-desktop-shell.patch"
      - name: 会话绑定集成测试
        env:
          DJIAN_SRC: /tmp/djian
        run: node --import ./tests/engine/loader.mjs --test tests/engine/store.test.mjs
      - name: 上游漂移探测（不拦截，只提示）
        continue-on-error: true
        run: |
          git clone -q "$UPSTREAM" /tmp/head && cd /tmp/head
          echo "上游 HEAD: $(git log --oneline -1)"
          for p in djian-session-binding djian-desktop-shell; do
            if git apply --check "${GITHUB_WORKSPACE}/engine/patches/$p.patch"; then
              echo "✅ $p 在 HEAD 仍可应用"
            else
              echo "⚠️ $p 在 HEAD 失配，升级 D剪 前需重新适配"
            fi
          done
