name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unit:
    name: 单元测试（规则/CLI/合规拦截/模板）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 安装测试依赖
        run: pip install -q pytest
      - name: CLI 能起来
        run: python mf.py -h
      - name: 单元测试
        env:
          MF_RULES: ${{ github.workspace }}/docs/剪辑规范.md
        run: python -m pytest -q --ignore=tests/engine
      - name: 语法检查
        run: python -m compileall -q mf.py huoke_lint.py

  engine:
    name: 引擎补丁集成测试（对上游真代码）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: 拉上游 D剪
        run: git clone --depth 1 https://github.com/Loliyer520/DSHL-DeepPack-Jian.git /tmp/djian
      - name: 打上我们的补丁（同名空项目复用 / 显式绑定 / 会话缓存）
        run: git -C /tmp/djian apply --verbose "${GITHUB_WORKSPACE}/engine/patches/djian-session-binding.patch"
      - name: 会话绑定集成测试
        env:
          DJIAN_SRC: /tmp/djian
        run: node --import ./tests/engine/loader.mjs --test tests/engine/store.test.mjs

  audio:
    name: 端到端（真 ffmpeg：响度归一 + QC 读数）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 装 ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: 安装测试依赖
        run: pip install -q pytest
      - name: 跑音频链
        env:
          MF_RULES: ${{ github.workspace }}/docs/剪辑规范.md
        run: python -m pytest -q tests/test_audio_e2e.py -v
