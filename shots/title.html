<!doctype html>
<html lang="zh"><meta charset="utf-8"><title>title</title>
<link rel="stylesheet" href="/multiplane/runtime/shot.css">
<style>
  :root{--ink:#fff;--accent:#FF3B5C;--dim:rgba(255,255,255,.72)}
  #stage{width:1080px;height:1920px;background:
     radial-gradient(120% 80% at 50% 0%, #1b2430 0%, #0d1218 55%, #080b0f 100%);color:var(--ink);
     font-family:"PingFang SC","Noto Sans CJK SC","Source Han Sans SC",sans-serif;overflow:hidden}
  .grain{position:absolute;inset:0;opacity:.06;background-image:radial-gradient(#fff 1px, transparent 1px);background-size:3px 3px}
  .wrap{position:absolute;left:96px;right:96px;top:680px}
  .kicker{font-size:40px;font-weight:600;letter-spacing:.22em;color:var(--accent);margin-bottom:34px}
  .title{font-size:110px;line-height:1.16;font-weight:800;letter-spacing:-.01em;
         text-shadow:0 0 2px #000,0 3px 10px rgba(0,0,0,.85);margin:0}
  .rule{height:6px;width:150px;background:var(--accent);margin:52px 0 40px;border-radius:3px}
  .sub{font-size:52px;line-height:1.5;color:var(--dim);text-shadow:0 0 2px #000;margin:0}
  .brand{position:absolute;left:96px;bottom:180px;font-size:40px;letter-spacing:.32em;color:rgba(255,255,255,.6)}
</style>
<div id="stage">
  <div class="grain"></div>
  <div class="wrap">
    <div class="kicker">{{KICKER}}</div>
    <h1 class="title">{{TITLE}}</h1>
    <div class="rule"></div>
    <p class="sub">{{SUB}}</p>
  </div>
  <div class="brand">{{BRAND}}</div>
</div>
<script src="/multiplane/runtime/shot.js"></script>
<script>
const kicker = document.querySelector('.kicker'), title = document.querySelector('.title');
const rule = document.querySelector('.rule'), sub = document.querySelector('.sub'), brand = document.querySelector('.brand');
Shot.define({ duration: 3, fps: 30,
  render(t){
    const e = (x) => 1 - Math.pow(1 - Math.min(1, Math.max(0, x)), 3);   // easeOutCubic
    const a = e((t - 0.05) / 0.6);
    kicker.style.opacity = String(a); kicker.style.transform = `translateY(${(1-a)*24}px)`;
    const b = e((t - 0.2) / 0.7);
    title.style.opacity = String(b); title.style.transform = `translateY(${(1-b)*44}px) scale(${0.985 + 0.015*b})`;
    const c = e((t - 0.5) / 0.5);
    rule.style.transform = `scaleX(${c})`; rule.style.transformOrigin = 'left center';
    const d = e((t - 0.7) / 0.6);
    sub.style.opacity = String(d); sub.style.transform = `translateY(${(1-d)*20}px)`;
    brand.style.opacity = String(e((t - 1.0) / 0.8) * 0.9);
  }});
</script></html>
